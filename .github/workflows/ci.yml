name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scanner-smoke-test:
    name: MSVC scanner validation (${{ matrix.mode }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        mode: [standard, address-sanitizer]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and run deterministic scanner test
        shell: pwsh
        run: |
          if ('${{ matrix.mode }}' -eq 'address-sanitizer') {
            ./tests/smoke_test.ps1 -EnableAddressSanitizer
          } else {
            ./tests/smoke_test.ps1
          }
